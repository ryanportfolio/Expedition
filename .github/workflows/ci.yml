# Build and node checks on every push and pull request. Browser checks (npm run check:browser) stay
# local: they need headed Chrome on a real GPU.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm run check:ip
